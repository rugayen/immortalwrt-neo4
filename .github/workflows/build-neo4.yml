name: Build ImmortalWrt for NanoPi NEO4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # GitHub 托管 runner（ubuntu-22.04，约 7GB 内存 / 14GB 磁盘）。本工作流已启用「释放磁盘空间」
    # 清理预装冗余软件（腾出 ~10-15GB）并降低编译并行度到 -j2，以尽量适配托管环境的资源限制。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 本仓库（含脚本）
        uses: actions/checkout@v4

      - name: 释放磁盘空间（清理 GitHub 托管 runner 预装冗余软件，腾出 ~10-15GB）
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android \
                     /usr/local/share/powershell /opt/ghc /usr/lib/mono* /opt/microsoft \
                     /usr/local/julia* /usr/share/swift 2>/dev/null || true
          sudo docker image prune -a -f 2>/dev/null || true
          echo "=== 清理后磁盘 ==="; df -h /

      - name: 安装编译依赖
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget ccache gdisk
          # RK3399 的 U-Boot 使用 binman（UBOOT_USE_BINMAN:=1），include/u-boot.mk 的
          # prereq 会检查 $(STAGING_DIR_HOST)/bin/python3 -c 'import elftools'；
          # 缺这个模块会在 make 一开始直接报
          #   "u-boot: Please install the Python3 elftools module" 并退出
          #（run#10 失败根因，仅 4 分钟就挂，根本没进入编译）。
          # apt 包装进 /usr/lib/python3/dist-packages，staging host python3 可见
          #（同机制下 python3-setuptools 检查已 ok）。pip 兜底防止 universe 源不可用。
          $SUDO apt-get install -y --no-install-recommends python3-pyelftools python3-pip || true
          if ! /usr/bin/python3 -c 'import elftools' 2>/dev/null; then
            $SUDO /usr/bin/python3 -m pip install --no-cache-dir pyelftools || true
          fi
          echo "=== pyelftools 自检 ==="
          /usr/bin/python3 -c 'import elftools; print("system python3 OK:", elftools.__version__)'
          python3 -c 'import elftools; print("PATH python3 OK:", elftools.__version__)'

      - name: 克隆 ImmortalWrt 源码（固定 v25.12.2 稳定版）
        run: |
          # 用发布 tag 而非 master 快照：可复现，feeds.conf.default 里的 feed 也锁定到
          # 该版本对应的固定 commit。已核对 v25.12.2 的 rockchip/armv8、uboot-rockchip
          # (U-Boot 2025.10)、rkbin、pine64-bin 布局与现有 NEO4 移植补丁完全兼容。
          git clone --depth 1 --branch v25.12.2 \
            https://github.com/immortalwrt/immortalwrt.git immwrt

      - name: 移植 NEO4 设备定义 + U-Boot
        working-directory: immwrt
        run: |
          ./scripts/feeds update -a
          # 不要安装 video 源：master 快照里 video/qt5 存在循环依赖，
          # 一旦装入配置树，make defconfig 会中断，导致 U-Boot/ATF 等包无法选中。
          ./scripts/feeds install packages luci routing telephony

          cat >> target/linux/rockchip/image/armv8.mk <<'EOF'

          define Device/friendlyarm_nanopi-neo4
            $(Device/rk3399)
            DEVICE_VENDOR := FriendlyARM
            DEVICE_MODEL := NanoPi NEO4
            BOOT_FLOW := pine64-bin
            # 与 U-Boot 变体名一致，pine64-bin 据此 dd nanopi-neo4-rk3399-uboot.img 进镜像。
            UBOOT_DEVICE_NAME := nanopi-neo4-rk3399
            DEVICE_PACKAGES := kmod-brcmfmac brcmfmac-firmware-43430-sdio brcmfmac-nvram-43430-sdio
          endef

          TARGET_DEVICES += friendlyarm_nanopi-neo4
          EOF

          # (a) 把 nanopi-neo4-rk3399 加入 UBOOT_TARGETS（在末尾 eval 之前，列表内）
          sed -i 's|^\(  rock-5c-rk3588s\)$|\1 \\\n  nanopi-neo4-rk3399|' \
            package/boot/uboot-rockchip/Makefile

          # (b) 把 U-Boot 变体定义插入到文件末尾的 $(eval $(call BuildPackage/U-Boot)) 之前。
          #     关键：旧版用 cat >> 把定义追加到文件末尾，而该 eval 在解析时就执行，
          #     导致 DUMP 阶段 $(call U-Boot/nanopi-neo4-rk3399) 取到空定义，包被建为空壳、
          #     InstallDev 不出 nanopi-neo4-rk3399-uboot.img，最终 pine64-bin 流程 dd 时
          #     "No such file or directory"（run#9 失败根因）。
          cat > /tmp/neo4_uboot_block.txt <<'UBEOF'

          define U-Boot/nanopi-neo4-rk3399
            $(U-Boot/rk3399/Default)
            NAME:=NanoPi NEO4
            BUILD_DEVICES:= \
              friendlyarm_nanopi-neo4
          endef

          UBEOF
          awk '/eval.*BuildPackage\/U-Boot/{while((getline l < "/tmp/neo4_uboot_block.txt")>0) print l} {print}' \
            package/boot/uboot-rockchip/Makefile > /tmp/uboot_mk.tmp \
            && mv /tmp/uboot_mk.tmp package/boot/uboot-rockchip/Makefile

      - name: 注入运维手册最终态配置（10.10.10.74）
        working-directory: immwrt
        run: |
          # 仓库 files/ 下是「10.10.10.74 运维手册」的最终态配置原文
          # （snapshots/*.txt 逐字节复制）+ 首次启动脚本。OpenWrt 会把源码根
          # files/ 原样打进 rootfs，因此刷完开机即是手册记录的最终状态，
          # 不用再按 docs/03 第 4 节的「重刷后重建清单」手工重做。
          # 包含：network / dhcp / firewall / wireless、apk feeds(video 已移除)、
          #       rc.local(/opt)、SSH authorized_keys、IPv6 sysctl、3 个 uci-defaults。
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/files/." files/
          chmod +x files/etc/uci-defaults/* files/etc/rc.local
          chmod 600 files/etc/dropbear/authorized_keys
          echo "=== 注入的 rootfs 文件 ==="
          find files -type f -printf '%p  %s bytes\n' | sort
          echo "=== uci-defaults 权限 ==="
          ls -l files/etc/uci-defaults/

      - name: 配置（target=rockchip/armv8, device=nanopi-neo4 + LuCI）
        working-directory: immwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-neo4=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          # LuCI 简体中文语言包（ImmortalWrt luci feed 里 po 目录为 zh_Hans，
          # 但 LUCI_LC_ALIAS.zh_Hans=zh-cn，包名仍是 luci-i18n-base-zh-cn）。
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          # DHCPv6 客户端（lan6 接口依赖），显式选中避免被裁剪
          CONFIG_PACKAGE_odhcp6c=y
          # root 分区 4GB：squashfs 之外的空间由 fstools 作为 overlay，
          # 即「软件包可用磁盘空间」约 4GB（默认仅约 160MB）。
          CONFIG_TARGET_ROOTFS_PARTSIZE=4096
          # eMMC 剩余空间自动分区 / 格式化 / 挂载所需工具
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-brcmfmac=y
          # 手册踩坑 #15：AP6212/BCM43430 SDIO 必须用 cypress-firmware-43430-sdio
          # （PROVIDES:=brcmfmac-firmware-43430-sdio），它同时创建 .bin 软链。
          # brcmfmac-firmware-43430-sdio 只是虚拟 provides 名，不是真实包，
          # 因此显式选中真实包，避免出厂无 phy0 / 无 wlan0。
          CONFIG_PACKAGE_cypress-firmware-43430-sdio=y
          CONFIG_PACKAGE_brcmfmac-firmware-43430-sdio=y
          CONFIG_PACKAGE_brcmfmac-nvram-43430-sdio=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_iw=y
          # 双保险：显式选中 NEO4 的 U-Boot 与 ATF 包，确保即使 defconfig 的
          # DEFAULT 推导有意外，这两个启动加载器相关包也一定会被构建并安装
          # 其产物（rk3399-idbloader.bin / rk3399-trust.bin / -uboot.img）。
          CONFIG_PACKAGE_u-boot-nanopi-neo4-rk3399=y
          CONFIG_PACKAGE_trusted-firmware-a-rk3399=y
          EOF
          make defconfig

      - name: 编译（降并行度 -j2，降低内存峰值）
        working-directory: immwrt
        run: make -j2 V=s

      - name: 分区表转换为 GPT
        working-directory: immwrt
        run: |
          # OpenWrt 默认生成 MBR 分区表。用 sgdisk --mbrtogpt 原地转 GPT，
          # 保留分区起止扇区、ext4 boot 分区与 LBA64/16384/24576 的引导 blob。
          # 脚本会逐项校验（EFI PART 签名 / 保护 MBR / 分区范围 / 引导 blob），
          # 任何一项不符即失败，避免产出无法启动的镜像。
          python3 "$GITHUB_WORKSPACE/neo4-gpt-convert.py" bin/targets/rockchip/armv8
          echo "=== 转换后再校验一次 ==="
          python3 "$GITHUB_WORKSPACE/neo4-gpt-convert.py" bin/targets/rockchip/armv8 --verify

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-neo4
          path: immwrt/bin/targets/rockchip/armv8/*nanopi-neo4*
          if-no-files-found: error
