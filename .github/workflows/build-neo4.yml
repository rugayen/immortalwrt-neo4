name: Build ImmortalWrt for NanoPi NEO4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # 自托管 runner：请在拥有 16GB+ 内存、30GB+ 空闲磁盘的 Linux 机器（推荐 Ubuntu 22.04）上
    # 安装并启动 GitHub Actions 自托管 runner，默认标签为 self-hosted + linux 即可被本工作流选中。
    # 编译并行度已降到 -j2 以降低内存峰值（如需更快，可在自托管机器资源充足时改回 -j$(nproc)）。
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout 本仓库（含脚本）
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget ccache

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 --branch master \
            https://github.com/immortalwrt/immortalwrt.git immwrt

      - name: 移植 NEO4 设备定义 + U-Boot
        working-directory: immwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cat >> target/linux/rockchip/image/armv8.mk <<'EOF'

          define Device/friendlyarm_nanopi-neo4
            $(Device/rk3399)
            DEVICE_VENDOR := FriendlyARM
            DEVICE_MODEL := NanoPi NEO4
            DEVICE_PACKAGES := kmod-brcmfmac brcmfmac-firmware-43430-sdio brcmfmac-nvram-43430-sdio
          endef

          TARGET_DEVICES += friendlyarm_nanopi-neo4
          EOF

          sed -i 's|^\(  rock-5c-rk3588s\)$|\1 \\\n  nanopi-neo4-rk3399|' \
            package/boot/uboot-rockchip/Makefile

          cat >> package/boot/uboot-rockchip/Makefile <<'EOF'

          define U-Boot/nanopi-neo4-rk3399
            $(U-Boot/rk3399/Default)
            NAME:=NanoPi NEO4
            BUILD_DEVICES:= \
              friendlyarm_nanopi-neo4
          endef
          EOF

      - name: 配置（target=rockchip/armv8, device=nanopi-neo4 + LuCI）
        working-directory: immwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-neo4=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-brcmfmac=y
          CONFIG_PACKAGE_brcmfmac-firmware-43430-sdio=y
          CONFIG_PACKAGE_brcmfmac-nvram-43430-sdio=y
          CONFIG_PACKAGE_wpad-openssl=y
          EOF
          make defconfig

      - name: 编译（降并行度 -j2，降低内存峰值）
        working-directory: immwrt
        run: make -j2 V=s

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-neo4
          path: immwrt/bin/targets/rockchip/armv8/*nanopi-neo4*
          if-no-files-found: error
